  #   volumes:
  #     - geneflow-blast-db:/blast/db
  #   restart: unless-stopped
  #   networks:
  #     - geneflow-network

volumes:
  geneflow-analysis-temp:
  # geneflow-blast-db:

networks:
  geneflow-network:
    external: true
