# =============================================================================
# GeneFlow Core Infrastructure
# =============================================================================
# Shared services: Redis, PostgreSQL, MinIO, Admin Tools
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis - Message Queue & Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: geneflow-core-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - geneflow-redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geneflow-network

  # ---------------------------------------------------------------------------
  # PostgreSQL - Main Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: geneflow-core-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geneflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geneflow}
      POSTGRES_DB: ${POSTGRES_DB:-geneflow}
    volumes:
      - geneflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geneflow} -d ${POSTGRES_DB:-geneflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geneflow-network

  # ---------------------------------------------------------------------------
  # MinIO - S3-Compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: geneflow-core-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geneflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geneflow123}
    volumes:
      - geneflow-minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geneflow-network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: geneflow-core-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set geneflow http://minio:9000 ${MINIO_ROOT_USER:-geneflow} ${MINIO_ROOT_PASSWORD:-geneflow123};
      mc mb geneflow/${MINIO_BUCKET:-geneflow} --ignore-existing;
      mc anonymous set download geneflow/${MINIO_BUCKET:-geneflow}/public;
      echo 'Bucket initialized';
      "
    networks:
      - geneflow-network

  # ---------------------------------------------------------------------------
  # Admin Tools (Development)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: geneflow-core-pgadmin
    profiles: ["admin"]
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@geneflow.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geneflow-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: geneflow-core-redis-ui
    profiles: ["admin"]
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: geneflow:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geneflow-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: geneflow-core-mailpit
    profiles: ["admin"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - geneflow-network

volumes:
  geneflow-redis-data:
  geneflow-postgres-data:
  geneflow-minio-data:

networks:
  geneflow-network:
    name: geneflow-network
    driver: bridge
