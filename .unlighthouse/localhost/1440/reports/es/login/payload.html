er Estudio\",\"description\":\"Ve a Estudios \u003e Nuevo Estudio. Ingresa un nombre, selecciona un campo de investigación (Genómica, Proteómica, etc.), añade una descripción y haz clic en Crear. Tu estudio comienza en estado Borrador.\"},\"uploadTraces\":{\"title\":\"Subir y Gestionar Trazas\",\"description\":\"Abre tu estudio, ve a la pestaña Trazas y haz clic en Subir. Arrastra archivos .ab1, .scf, .fastq o .fasta. Las trazas se validan y procesan automáticamente para métricas de calidad.\"},\"runPipeline\":{\"title\":\"Ejecutar Alineamientos\",\"description\":\"Selecciona 2+ trazas de tu estudio para crear un alineamiento. Elige Pairwise (2 trazas), Múltiple (3+), o alineamiento con Referencia. Los resultados incluyen secuencia consenso y detección de variantes.\"}}},\"categories\":{\"title\":\"Explorar por Tema\",\"description\":\"Explora artículos de ayuda organizados por categoría\",\"gettingStarted\":{\"title\":\"Primeros Pasos\",\"topics\":{\"createStudy\":\"Creando tu primer estudio\",\"setupProfile\":\"Configurando tu perfil\",\"inviteTeam\":\"Invitando miembros del equipo\",\"understandDashboard\":\"Entendiendo el panel\"}},\"studiesData\":{\"title\":\"Estudios y Datos\",\"topics\":{\"manageMetadata\":\"Gestionando metadatos de estudios\",\"uploadTraces\":\"Subiendo trazas de cromatogramas\",\"organizeSamples\":\"Organizando muestras\",\"shareStudies\":\"Compartiendo estudios con colaboradores\"}},\"pipelines\":{\"title\":\"Alineamientos\",\"topics\":{\"runPipelines\":\"Creando alineamientos de secuencias\",\"understandResults\":\"Entendiendo resultados de alineamiento\",\"qcMetrics\":\"Métricas de control de calidad\",\"exportData\":\"Exportando datos de alineamiento\"}},\"collaboration\":{\"title\":\"Colaboración\",\"topics\":{\"rolesPermissions\":\"Roles: Propietario, Admin, Editor, Observador\",\"inviteCollaborators\":\"Enviando invitaciones a colaboradores\",\"shareSecurely\":\"Publicando estudios públicamente\",\"manageAccess\":\"Transfiriendo prop vo se admiten?\",\"answer\":\"GeneFlow admite: AB1 (.ab1) - Archivos de cromatogramas Applied Biosystems con datos de calidad completos. SCF (.scf) - Standard Chromatogram Format. FASTQ (.fastq, .fq) - Secuencias con puntuaciones de calidad. FASTA (.fasta, .fa) - Archivos solo de secuencia. El tamaño máximo es 50MB por traza.\"},\"availablePipelines\":{\"question\":\"¿Qué tipos de alineamientos puedo crear?\",\"answer\":\"GeneFlow admite tres tipos de alineamiento: Pairwise - Comparar exactamente 2 secuencias. Múltiple - Alinear 3 o más secuencias simultáneamente. Referencia - Alinear secuencias contra una secuencia de referencia. Todos los alineamientos generan secuencias consenso y detectan variantes/SNPs.\"},\"inviteTeam\":{\"question\":\"¿Cuáles son los diferentes roles del equipo?\",\"answer\":\"Propietario - Control total, puede transferir propiedad (uno por estudio). Admin - Gestionar miembros, cambiar configuración y estado del estudio. Editor - Crear y editar trazas y alineamientos. Observador - Acceso solo lectura a los datos del estudio. Las invitaciones se envían por correo y deben aceptarse para unirse.\"},\"exportResults\":{\"question\":\"¿Cuáles son los estados de un estudio?\",\"answer\":\"Los estudios progresan a través de: Borrador - Configuración inicial, no visible. Activo - Trabajo en progreso. Completado - Investigación finalizada. Publicado - Visible públicamente en Descubrir. Archivado - Oculto pero preservado. Solo el Propietario o Admin puede cambiar el estado.\"},\"dataProtection\":{\"question\":\"¿Cómo protejo mi cuenta?\",\"answer\":\"Habilita la Autenticación de Dos Factores (2FA) usando TOTP con aplicaciones como Google Authenticator o Authy. También puedes iniciar sesión con Google o GitHub OAuth. Las sesiones expiran después de inactividad y pueden gestionarse en Configuración \u003e Seguridad.\"},\"fileFormats\":{\"question\":\"¿Cómo funciona el procesamiento de trazas?\",\"answer\":\"Después de subir, las trazas pasan por: Subida -
