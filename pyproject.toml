[project]
name = "geneflow-ai"
version = "1.0.0"
description = "AI-powered sequence analysis for GeneFlow: conversational copilot, BLAST integration, and intelligent annotations via Redis Streams"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "minio>=7.2.0",
    "biopython>=1.86",
    "matplotlib>=3.10.8",
    "torch>=2.0.0",
    "requests>=2.28.1",
    "aiohttp>=3.13.5",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.optional-dependencies]
training = [
    "tensorboard>=2.15.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.scripts]
ai = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv]
# CUDA index only used locally for GPU support; Dockerfile handles multi-arch
